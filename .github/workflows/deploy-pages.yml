name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: artifacts/alpine-reference/viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: artifacts/alpine-reference/viewer/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check Pages site size
        run: |
          node --input-type=module -e "import{readdir,stat}from'node:fs/promises';async function size(p){let n=0;for(const e of await readdir(p,{withFileTypes:true})){const f=p+'/'+e.name;n+=e.isDirectory()?await size(f):(await stat(f)).size;}return n;}const n=await size('dist');if(n>1000000000)throw new Error('Site exceeds GitHub Pages 1 GB limit: '+n+' bytes');"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/alpine-reference/viewer/dist
      - uses: actions/deploy-pages@v5
        id: deployment
